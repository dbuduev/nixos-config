# mako: notification daemon for the niri session (deployed by home/home.nix).
# Reload after a switch with `makoctl reload`. Options: man 5 mako.

# Dismiss notifications after 3 seconds (milliseconds; 0 = never).
default-timeout=3000

# Critical ones (low battery, failures) stay until dismissed.
[urgency=critical]
default-timeout=0
