# mako: notification daemon for the niri session (deployed by home/home.nix).
# Reload after a switch with `makoctl reload`. Options: man 5 mako.

# Dismiss notifications after 3 seconds (milliseconds; 0 = never).
default-timeout=3000

# Critical ones (low battery, failures) stay until dismissed and stand out:
# dark red with a thick bright border instead of mako's default blue.
[urgency=critical]
default-timeout=0
background-color=#5a1010
text-color=#ffffff
border-color=#ff5555
border-size=4
